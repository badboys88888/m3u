name: Build M3U

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成m3u
        run: python generate_m3u.py

      - name: 提交
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add live.m3u
          git commit -m "update m3u" || echo "no change"
          git push
